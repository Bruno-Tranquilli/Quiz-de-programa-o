<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz sobre Programação</title>
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

  <main class="container">
    <h1>Quiz sobre Programação</h1>

    <div class="info">
      <h2>Sobre o quiz</h2>
      <p>Quiz criado para testar seus conhecimentos em programação!</p>
    </div>

    <h2 class="start-title">Preparado pra começar?</h2>

    <div class="buttons">
      <button class="btn" id="createAccountBtn">Criar Conta</button>
      <button class="btn" id="loginBtn">Entrar</button>
      <button class="btn hidden" id="startQuizBtn">Ir para o Quiz</button>
    </div>
  </main>

  <!-- MODAL CRIAR CONTA -->
  <div class="overlay hidden" id="createAccountModal">
    <div class="modal">
      <h2>Criar Conta</h2>
      <form id="createForm">
        <input type="text" name="username" placeholder="Nome de usuário" required>
        <input type="password" name="password" placeholder="Senha" required>
        <input type="password" name="confirmPassword" placeholder="Confirmar senha" required>
        <span class="error-msg" id="createErrorMsg"></span>
        <button type="submit" class="btn">Criar Conta</button>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div class="overlay hidden" id="loginModal">
    <div class="modal">
      <h2>Entrar</h2>
      <form id="loginForm">
        <input type="text" name="username" placeholder="Nome de usuário" required>
        <input type="password" name="password" placeholder="Senha" required>
        <span class="error-msg" id="loginErrorMsg"></span>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </div>

<script src="js/home.js"></script>

</body>
</html>
